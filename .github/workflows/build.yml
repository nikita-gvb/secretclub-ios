name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          # Xcode 26 (iOS 26 SDK): только с ним iOS включает Liquid Glass (новый таб-бар и пр.).
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      # LibXray собираем сами (scripts/build-libxray.sh): в официальной сборке ядро будит
      # процессор каждую секунду (FreeOSMemory) — это лишний расход батареи; плюс наш
      # SecretClubCounter (счётчики трафика). Официальная сборка без него не подойдёт.
      - name: Restore LibXray
        id: libxray-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor/LibXray.xcframework
          key: libxray-sc-${{ hashFiles('scripts/libxray/**', 'scripts/build-libxray.sh') }}

      - name: Go
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build LibXray
        id: libxray-build
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
        run: ./scripts/build-libxray.sh Vendor

      - name: Save LibXray
        if: steps.libxray-cache.outputs.cache-hit != 'true' && steps.libxray-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: Vendor/LibXray.xcframework
          key: ${{ steps.libxray-cache.outputs.cache-primary-key }}

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | test("^iPhone [0-9]+ Pro$"))]
            | last | .udid // empty')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      # Сборка для симулятора + юнит-тесты (CoreConfig, журналы, модели). Скриншоты больше не снимаем.
      - name: Build and test (simulator)
        run: |
          mkdir -p build
          if ! xcodebuild -project SecretClub.xcodeproj -scheme SecretClub -configuration Debug \
               -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/sim \
               CODE_SIGNING_ALLOWED=NO test > build/sim.log 2>&1; then
            grep -E "error:|fatal|BUILD FAILED|TEST FAILED|failed \(|XCTAssert" build/sim.log | head -80
            exit 1
          fi
          grep -E "warning:" build/sim.log | grep -v "^ld:" | sort -u | head -40 || true
          grep -E "Executed [0-9]+ tests?" build/sim.log | tail -1
          echo "Simulator build + tests OK"

      - name: Build unsigned IPA
        run: |
          if ! xcodebuild -project SecretClub.xcodeproj -scheme SecretClub -configuration Release \
               -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/dev \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build/dev.log 2>&1; then
            grep -E "error:|fatal|BUILD FAILED" build/dev.log | head -80
            exit 1
          fi
          APP=build/dev/Build/Products/Release-iphoneos/SecretClub.app
          xcrun strip -Sx "$APP/SecretClub" "$APP/PlugIns/PacketTunnel.appex/PacketTunnel" \
            "$APP/PlugIns/SecretClubWidgets.appex/SecretClubWidgets" || true
          ls -la "$APP" "$APP/PlugIns/PacketTunnel.appex" "$APP/PlugIns/SecretClubWidgets.appex"
          # ad-hoc подпись с entitlements, чтобы сервисы переподписи видели нужные права
          # (Network Extension и общая папка App Group для виджетов и журналов)
          codesign --force --sign - --entitlements Support/PacketTunnel.entitlements "$APP/PlugIns/PacketTunnel.appex"
          codesign --force --sign - --entitlements Support/SecretClubWidgets.entitlements "$APP/PlugIns/SecretClubWidgets.appex"
          codesign --force --sign - --entitlements Support/SecretClub.entitlements "$APP"
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../SecretClub-unsigned.ipa Payload)
          ls -la SecretClub-unsigned.ipa
          codesign -d --entitlements - "$APP/PlugIns/PacketTunnel.appex" 2>/dev/null | tail -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: SecretClub-unsigned-ipa
          path: SecretClub-unsigned.ipa
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
