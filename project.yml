name: SecretClub
options:
  bundleIdPrefix: com.secretclub
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: "$(inherited) -lresolv -framework Security -framework CoreFoundation"
    DEAD_CODE_STRIPPING: YES
targets:
  SecretClub:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Common
      - path: Geo
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app
        PRODUCT_NAME: SecretClub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Support/SecretClub.entitlements
    info:
      path: Support/SecretClub-Info.plist
      properties:
        CFBundleDisplayName: SecretClub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Камера нужна, чтобы отсканировать QR-код подписки.
        LSApplicationQueriesSchemes: [tg]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.secretclub.app.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: com.secretclub.app
            CFBundleURLSchemes: [secretclub]
    dependencies:
      - target: PacketTunnel
      - target: SecretClubWidgets
      - framework: Vendor/LibXray.xcframework
        embed: false
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      - path: Geo
        buildPhase: resources
    dependencies:
      - framework: Vendor/LibXray.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app.tunnel
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Support/PacketTunnel.entitlements
    info:
      path: Support/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: SecretClub Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
  SecretClubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Common
      - path: Shared/AppGroup.swift
      - path: Shared/DiagLog.swift
      - path: Shared/SharedStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app.widgets
        PRODUCT_NAME: SecretClubWidgets
        CODE_SIGN_ENTITLEMENTS: Support/SecretClubWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
    info:
      path: Support/SecretClubWidgets-Info.plist
      properties:
        CFBundleDisplayName: SecretClub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SecretClubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/CoreConfig.swift
      - path: Shared/TunnelShared.swift
      - path: Shared/NetworkCheck.swift
      - path: Shared/Probe.swift
      - path: Shared/SharedStatus.swift
      - path: Shared/AppGroup.swift
      - path: Shared/DiagLog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SecretClub:
    build:
      targets:
        SecretClub: all
        PacketTunnel: all
        SecretClubWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SecretClubTests
    archive:
      config: Release
