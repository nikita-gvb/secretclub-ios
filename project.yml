name: SecretClub
options:
  bundleIdPrefix: com.secretclub
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  SecretClub:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app
        PRODUCT_NAME: SecretClub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Support/SecretClub.entitlements
    info:
      path: Support/SecretClub-Info.plist
      properties:
        CFBundleDisplayName: SecretClub
        CFBundleLocalizations: [ru]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Камера нужна, чтобы отсканировать QR-код подписки.
        CFBundleURLTypes:
          - CFBundleURLName: com.secretclub.app
            CFBundleURLSchemes: [secretclub]
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secretclub.app.tunnel
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Support/PacketTunnel.entitlements
    info:
      path: Support/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: SecretClub Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
schemes:
  SecretClub:
    build:
      targets:
        SecretClub: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
